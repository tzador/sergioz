<title>3D gallery</title>
<style>
  :root {
    --paper: #f2ede3;
    --ink: #1f1c18;
    --accent: #b2432c;
    --muted: #8a8173;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: Georgia, 'Times New Roman', serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1f1c18; color: var(--paper); font-family: var(--serif); -webkit-user-select: none; user-select: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  #brand { position: fixed; top: 18px; left: 20px; color: rgba(242, 237, 227, .8); text-decoration: none; }
  #brand:hover { color: var(--paper); }
  #map { position: fixed; top: 16px; right: 16px; opacity: .9; pointer-events: none; border: 1px solid rgba(242, 237, 227, .25); background: rgba(31, 28, 24, .6); }
  #map.hidden { display: none; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(242, 237, 227, .85); box-shadow: 0 0 0 1px rgba(31, 28, 24, .5); pointer-events: none; transition: transform .15s, opacity .2s; }
  #crosshair.hot { transform: scale(1.8); background: var(--accent); }
  #crosshair.hidden { opacity: 0; }
  #caption { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); width: max-content; max-width: min(640px, calc(100vw - 32px)); padding: 14px 20px 12px; background: rgba(251, 249, 244, .96); color: var(--ink); box-shadow: 0 14px 30px -14px rgba(0, 0, 0, .7); opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center; }
  #caption.show { opacity: 1; }
  #caption .title { font-style: italic; font-size: 20px; line-height: 1.25; }
  #caption .details { margin-top: 6px; color: var(--muted); }
  #caption .num { color: var(--accent); margin-left: 12px; }
  #caption .hint { margin-top: 10px; color: var(--muted); font-size: 10px; }
  #help { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 10px 16px; color: rgba(242, 237, 227, .85); background: rgba(31, 28, 24, .55); text-align: center; line-height: 1.6; pointer-events: none; transition: opacity .6s; }
  #help.hidden { opacity: 0; }
  #progress { position: fixed; left: 20px; bottom: 20px; color: rgba(242, 237, 227, .6); pointer-events: none; }
</style>
</head>

<script>
'use strict';

// ---------------------------------------------------------------------------
// Data, language, DOM
// ---------------------------------------------------------------------------
const DATA = JSON.parse(document.getElementById('data').textContent);
const params = new URLSearchParams(location.search);
const LANG = ['en', 'el', 'ua'].includes(params.get('lang')) ? params.get('lang') : 'en';
const T = (key) => DATA.strings[key][LANG];
const TOUCH = matchMedia('(pointer: coarse)').matches;
const $ = (sel) => document.querySelector(sel);

document.documentElement.lang = { en: 'en', el: 'el', ua: 'uk' }[LANG];
document.title = `${DATA.name[LANG]} — ${T('title')}`;
$('#brand').textContent = `${DATA.name[LANG]} — ${T('title')}`;
$('#brand').href = `/${LANG}`;
$('#help').textContent = TOUCH ? T('controlsTouch') : T('controls');

const canvas = $('#gl');
const gl = canvas.getContext('webgl2', { antialias: true, powerPreference: 'high-performance' });
if (!gl) {
  $('#help').textContent = T('noWebgl');
  throw new Error('WebGL2 unavailable');
}

// ---------------------------------------------------------------------------
// Floor plan. One cell is 0.5 m; everything outside the rooms and doorways is
// solid wall, so the gallery is a closed network of rooms with no way out.
// ---------------------------------------------------------------------------
const CS = 0.5, GW = 56, GH = 44;
const WALL_H = 3.6, EYE = 1.62, HANG = 1.5;

// Rooms in the order paintings are hung: a loop A → B → C → G → F → E → D.
const ROOMS = [
  { x: 1, z: 1, w: 24, h: 16 },   // A  12 × 8 m, start room
  { x: 26, z: 1, w: 16, h: 16 },  // B
  { x: 43, z: 1, w: 12, h: 16 },  // C
  { x: 39, z: 18, w: 16, h: 25 }, // G
  { x: 18, z: 32, w: 20, h: 11 }, // F
  { x: 18, z: 18, w: 20, h: 13 }, // E
  { x: 1, z: 18, w: 16, h: 25 },  // D
];
const DOORS = [
  { x: 25, z: 7, w: 1, h: 3 },  // A – B
  { x: 42, z: 7, w: 1, h: 3 },  // B – C
  { x: 11, z: 17, w: 3, h: 1 }, // A – D
  { x: 29, z: 17, w: 3, h: 1 }, // B – E
  { x: 46, z: 17, w: 3, h: 1 }, // C – G
  { x: 17, z: 23, w: 1, h: 3 }, // D – E
  { x: 26, z: 31, w: 3, h: 1 }, // E – F
  { x: 38, z: 36, w: 1, h: 3 }, // F – G
];

const solid = new Uint8Array(GW * GH).fill(1);
const cellRoom = new Int8Array(GW * GH).fill(-1);
function carve(rect, room) {
  for (let z = rect.z; z < rect.z + rect.h; z++)
    for (let x = rect.x; x < rect.x + rect.w; x++) { solid[z * GW + x] = 0; cellRoom[z * GW + x] = room; }
}
ROOMS.forEach((r, i) => carve(r, i));
DOORS.forEach((d) => {
  d.room = ROOMS.findIndex((r) => d.x >= r.x - 1 && d.x + d.w <= r.x + r.w + 1 && d.z >= r.z - 1 && d.z + d.h <= r.z + r.h + 1);
  carve(d, d.room);
});
const isSolid = (x, z) => {
  const cx = Math.floor(x / CS), cz = Math.floor(z / CS);
  return cx < 0 || cz < 0 || cx >= GW || cz >= GH || solid[cz * GW + cx] === 1;
};

// Paintings: polaroid-style frames. Sizes keep the catalogue proportions but

// watercolours still read from across a 3.6 m-high room.
// ---------------------------------------------------------------------------
const PAINTINGS = DATA.pictures.map((p) => {

  const area = (p.size[0] / 100) * (p.size[1] / 100);
  let w = Math.sqrt(area * aspect), h = w / aspect;
  const longest = Math.max(w, h);
  const factor = Math.min(2.4, Math.max(1.1, longest * 2)) / longest;
  w *= factor; h *= factor;

  return { ...p, w, h, border, bottom: border * 2.4 + 0.05, fw: w + 2 * border, fh: h + border + border * 2.4 + 0.05, caption: p.captions[LANG] };

// Hand paintings along the runs in catalogue order, spread in proportion to
// wall length so every room gets its share.
{
  const MARGIN = 0.35;
  const total = RUNS.reduce((s, r) => s + r.len, 0);
  let next = 0, carry = 0;
  for (const run of RUNS) {
    const share = (PAINTINGS.length * run.len) / total + carry;
    let count = Math.min(Math.round(share), PAINTINGS.length - next);
    const widthOf = (k) => PAINTINGS.slice(next, next + k).reduce((s, p) => s + p.fw, 0);
    while (count > 0 && widthOf(count) + (count + 1) * MARGIN > run.len) count--;
    carry = share - count;
    const group = PAINTINGS.slice(next, next + count);
    const spacing = (run.len - widthOf(count)) / (count + 1);
    let t = spacing;
    for (const p of group) {
      t += p.fw / 2;
      p.room = run.room;
      p.D = [run.dir[0], 0, run.dir[1]];
      p.N = run.n;
      let cy = HANG;
      cy = Math.max(cy, 0.45 + p.bottom + p.h / 2);
      cy = Math.min(cy, WALL_H - 0.4 - p.border - p.h / 2);
      p.center = [run.start[0] + run.dir[0] * t, cy, run.start[1] + run.dir[1] * t];
      t += p.fw / 2 + spacing;
    }
    next += count;
  }

  if (next < PAINTINGS.length) console.warn(`${PAINTINGS.length - next} paintings could not be hung`);

    .sort((a, b) => a.d - b.d);
  for (const { p } of near) loadFull(p);
  const loaded = PAINTINGS.filter((p) => p.full && p !== focus.target).map((p) => ({ p, d: v3.len(v3.sub(p.center, pos)) })).sort((a, b) => b.d - a.d);
  while (loaded.length > MAX_FULL) { const { p } = loaded.shift(); gl.deleteTexture(p.full); p.full = null; }
}

// ---------------------------------------------------------------------------
// Camera, movement, focus
// ---------------------------------------------------------------------------
const startRoom = ROOMS[0];
const cam = { pos: [(startRoom.x + startRoom.w / 2) * CS, EYE, (startRoom.z + startRoom.h / 2 + 1) * CS], yaw: 0, pitch: 0, fov: 62 };
const keys = new Set();
const focus = { target: null, anim: null, baseFov: 62 };
let bob = 0;

const forwardOf = (yaw, pitch) => [Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch)];
function canStand(x, z) {
  const r = 0.3;
  for (const [dx, dz] of [[-r, -r], [r, -r], [-r, r], [r, r], [0, -r], [0, r], [-r, 0], [r, 0]]) if (isSolid(x + dx, z + dz)) return false;
  return true;
}
function pick(maxDist) {
  const origin = cam.pos, dir = forwardOf(cam.yaw, cam.pitch);
  let best = null, bestT = maxDist;
  for (const p of PAINTINGS) {
    const denom = v3.dot(dir, p.N);
    if (denom >= -1e-6) continue;
    const t = v3.dot(v3.sub(p.center, origin), p.N) / denom;
    if (t <= 0 || t >= bestT) continue;
    const rel = v3.sub(v3.add(origin, v3.scale(dir, t)), p.center);
    const u = v3.dot(rel, p.D), v = rel[1];
    if (u < p.extent.l || u > p.extent.r || v < p.extent.b || v > p.extent.t) continue;
    best = p; bestT = t;
  }
  return best;
}
function focusOn(p) {
  const aspect = canvas.width / canvas.height, fovy = (cam.fov * Math.PI) / 180;
  const fovx = 2 * Math.atan(Math.tan(fovy / 2) * aspect);
  let dist = Math.max(p.fh / (2 * Math.tan(fovy / 2)), p.fw / (2 * Math.tan(fovx / 2))) / 0.78;
  dist = Math.min(6, Math.max(0.55, dist));
  // walk out from the wall until the spot is free or the distance is reached
  let pos = null;
  for (let d = 0.45; d <= dist; d += 0.05) {
    const q = v3.add(p.center, v3.scale(p.N, d));
    if (!canStand(q[0], q[2])) break;
    pos = [q[0], EYE, q[2]];
  }
  if (!pos) return;
  const to = v3.sub(p.center, pos);
  const yaw = Math.atan2(to[0], -to[2]), pitch = Math.atan2(to[1], Math.hypot(to[0], to[2]));
  focus.target = p;
  focus.anim = { t: 0, from: { pos: cam.pos.slice(), yaw: cam.yaw, pitch: cam.pitch }, to: { pos, yaw, pitch } };
  // choose the shortest turn
  while (focus.anim.to.yaw - focus.anim.from.yaw > Math.PI) focus.anim.to.yaw -= 2 * Math.PI;
  while (focus.anim.to.yaw - focus.anim.from.yaw < -Math.PI) focus.anim.to.yaw += 2 * Math.PI;
  loadFull(p);
}
// step back: stay where we are, level the view again
function exitFocus() {
  if (!focus.target) return;
  focus.target = null;
  cam.fov = focus.baseFov;
  focus.anim = { t: 0.3, from: { pos: cam.pos.slice(), yaw: cam.yaw, pitch: cam.pitch }, to: { pos: cam.pos.slice(), yaw: cam.yaw, pitch: 0 } };
}
function act() {
  const hit = pick(focus.target ? 12 : 4.5);
  if (focus.target) { if (hit && hit !== focus.target) focusOn(hit); else exitFocus(); }
  else if (hit) focusOn(hit);
}

function update(dt) {
  if (focus.anim) {
    const a = focus.anim; a.t = Math.min(1, a.t + dt / 0.7);
    const e = 1 - Math.pow(1 - a.t, 3);
    cam.pos = [0, 1, 2].map((i) => a.from.pos[i] + (a.to.pos[i] - a.from.pos[i]) * e);
    cam.yaw = a.from.yaw + (a.to.yaw - a.from.yaw) * e;
    cam.pitch = a.from.pitch + (a.to.pitch - a.from.pitch) * e;
    if (a.t >= 1) focus.anim = null;
    return;
  }
  let turn = 0, walk = 0;
  if (keys.has('ArrowLeft')) turn -= 1;
  if (keys.has('ArrowRight')) turn += 1;
  if (keys.has('ArrowUp')) walk += 1;
  if (keys.has('ArrowDown')) walk -= 1;
  if (drag) { turn += drag.turn; walk += drag.walk; }
  if (focus.target) {
    // while looking closer: up/down zoom, left/right step back and turn
    if (walk) cam.fov = Math.max(18, Math.min(focus.baseFov, cam.fov - walk * 40 * dt));
    if (turn) exitFocus();
    return;
  }
  if (turn) cam.yaw += turn * 1.7 * dt;
  if (walk) {
    const speed = 2.3 * Math.min(1, Math.abs(walk)) * Math.sign(walk);
    const nx = cam.pos[0] + Math.sin(cam.yaw) * speed * dt, nz = cam.pos[2] - Math.cos(cam.yaw) * speed * dt;
    if (canStand(nx, cam.pos[2])) cam.pos[0] = nx;
    if (canStand(cam.pos[0], nz)) cam.pos[2] = nz;
    bob += dt * Math.abs(speed) * 2.6;
  }
  cam.pos[1] = EYE + Math.sin(bob) * 0.018;
}

// ---------------------------------------------------------------------------
// Input: arrows on the keyboard; one finger on touch screens
// ---------------------------------------------------------------------------
const help = $('#help');
let helpDismissed = false;
const helpTimer = setTimeout(dismissHelp, 12000);
function dismissHelp() { clearTimeout(helpTimer); helpDismissed = true; }

document.addEventListener('keydown', (e) => {
  if (e.code.startsWith('Arrow')) { e.preventDefault(); dismissHelp(); }
  if (e.code === 'KeyM') $('#map').classList.toggle('hidden');
  if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); dismissHelp(); act(); }
  if (e.code === 'Escape') exitFocus();
  keys.add(e.code);
});
document.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

// touch: horizontal drag turns, vertical drag walks (like a joystick centred
// where the finger landed); a short tap looks closer / steps back
let drag = null;
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch' || drag) return;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  drag = { id: e.pointerId, x: e.clientX, sx: e.clientX, sy: e.clientY, t: performance.now(), turn: 0, walk: 0, moved: false };
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x;
  drag.x = e.clientX;
  if (!focus.anim) cam.yaw += dx * 0.006;
  drag.walk = Math.max(-1, Math.min(1, (drag.sy - e.clientY) / 70));
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 10) { drag.moved = true; dismissHelp(); }
});
const endTouch = (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && performance.now() - drag.t < 350) { dismissHelp(); act(); }
  drag = null;
};
canvas.addEventListener('pointerup', endTouch);
canvas.addEventListener('pointercancel', endTouch);

// ---------------------------------------------------------------------------
// Minimap
// ---------------------------------------------------------------------------
const map = $('#map'), MS = 3;
map.width = GW * MS; map.height = GH * MS;
map.style.width = `${GW * MS}px`; map.style.height = `${GH * MS}px`;
const mapStatic = document.createElement('canvas');
mapStatic.width = map.width; mapStatic.height = map.height;
{
  const g = mapStatic.getContext('2d');
  g.fillStyle = 'rgba(242,237,227,.22)';
  for (let z = 0; z < GH; z++) for (let x = 0; x < GW; x++) if (!solid[z * GW + x]) g.fillRect(x * MS, z * MS, MS, MS);
  g.fillStyle = '#b2432c';
  for (const p of PAINTINGS) {
    const x = p.center[0] / CS * MS, z = p.center[2] / CS * MS, hw = Math.max(1.5, (p.fw / CS) * MS / 2);
    if (p.D[0] !== 0) g.fillRect(x - hw, z - 1 + p.N[2] * 0.5, hw * 2, 1.5);
    else g.fillRect(x - 1 + p.N[0] * 0.5, z - hw, 1.5, hw * 2);
  }
}
function drawMap() {
  const g = map.getContext('2d');
  g.clearRect(0, 0, map.width, map.height);
  g.drawImage(mapStatic, 0, 0);
  const x = cam.pos[0] / CS * MS, z = cam.pos[2] / CS * MS;
  g.strokeStyle = '#f2ede3'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(x, z); g.lineTo(x + Math.sin(cam.yaw) * 9, z - Math.cos(cam.yaw) * 9); g.stroke();
  g.fillStyle = '#f2ede3'; g.beginPath(); g.arc(x, z, 2.5, 0, Math.PI * 2); g.fill();
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
gl.enable(gl.DEPTH_TEST);
gl.clearColor(0.1, 0.085, 0.075, 1);
gl.uniform1i(U.uTex, 0);
gl.uniform3f(U.uAmbient, 0.58, 0.57, 0.55);
gl.uniform3f(U.uLightColor, 1.0, 0.94, 0.84);
gl.uniform1f(U.uLightPower, 2.6);
gl.uniform3f(U.uFogColor, 0.1, 0.085, 0.075);
gl.uniform1f(U.uFogDensity, 0.028);

function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
}
function draw(mesh, { tex = null, color = [1, 1, 1], unlit = 0, material = 0, alpha = 1 } = {}) {
  if (!mesh) return;
  gl.bindTexture(gl.TEXTURE_2D, tex || TEX.white);
  gl.uniform1i(U.uUseTex, tex ? 1 : 0);
  gl.uniform3fv(U.uColor, color);
  gl.uniform1f(U.uUnlit, unlit);
  gl.uniform1i(U.uMaterial, material);
  gl.uniform1f(U.uAlpha, alpha);
  gl.bindVertexArray(mesh.vao);
  gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
}
function setLights(room) {
  const flat = new Float32Array(24);
  room.lights.forEach((l, i) => flat.set(l, i * 3));
  gl.uniform3fv(U['uLightPos[0]'], flat);
  gl.uniform1i(U.uLightCount, room.lights.length);
}

const captionEl = $('#caption');
let shownCaption = null;
function updateHud() {
  const target = focus.target || pick(4.5);
  $('#crosshair').classList.toggle('hot', !!target && !focus.target);
  $('#crosshair').classList.toggle('hidden', !!focus.target);
  if (target !== shownCaption) {
    shownCaption = target;
    captionEl.classList.toggle('show', !!target);
    if (target) {
      captionEl.querySelector('.title').textContent = target.caption.title;
      captionEl.querySelector('.details').innerHTML = '';
      captionEl.querySelector('.details').append(target.caption.details, Object.assign(document.createElement('span'), { className: 'num', textContent: `№${target.id}` }));
    }
  }
  if (target) captionEl.querySelector('.hint').textContent = focus.target ? T(TOUCH ? 'stepBackTouch' : 'stepBack') : T(TOUCH ? 'lookCloserTouch' : 'lookCloser');
  help.classList.toggle('hidden', helpDismissed || !!target);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  resize();
  update(dt);
  const forward = forwardOf(cam.yaw, cam.pitch);
  manageFullImages(cam.pos, forward);

  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.BLEND);
  gl.depthMask(true);
  gl.uniformMatrix4fv(U.uProj, false, perspective((cam.fov * Math.PI) / 180, canvas.width / canvas.height, 0.05, 80));
  gl.uniformMatrix4fv(U.uView, false, lookAt(cam.pos, v3.add(cam.pos, forward), [0, 1, 0]));
  gl.uniform3fv(U.uCamPos, cam.pos);

  rooms.forEach((room, i) => {
    setLights(room.def);
    draw(room.floor, { tex: TEX.wood });
    draw(room.ceiling, { tex: TEX.ceiling, color: [0.9, 0.89, 0.87] });
    draw(room.walls, { tex: TEX.plaster, material: 1 });
    draw(room.frames, { color: [0.985, 0.97, 0.94] });
    draw(room.lamps, { color: [1, 0.97, 0.9], unlit: 1 });
    for (const p of PAINTINGS) {
      if (p.room !== i) continue;
      const tex = p.full || p.thumb;
      draw(p.mesh, tex ? { tex, unlit: 0.55 } : { color: [0.82, 0.78, 0.7] });
      draw(p.labelMesh, { tex: p.labelTex });
    }
  });
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  for (const room of rooms) draw(room.shadows, { tex: TEX.shadow, color: [0, 0, 0], unlit: 1, alpha: 0.38 });

  updateHud();
  drawMap();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
